# Checks Wikipedia and Wikidata for changes every day, whenever you upload changes, and whenever you press "Run workflow".
# Saves any new data and photos back into the repository, then publishes the site to GitHub Pages.
# If something can't be read cleanly, the site keeps its last good data and an issue is opened in this repository.
name: Sync ministers and publish

on:
  schedule:
    - cron: "15 21 * * *"     # every day at 02:45 India time
  workflow_dispatch:
    inputs:
      force:
        description: "Apply portfolio changes even if there are a lot at once (use after a reshuffle you've checked)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths-ignore: ["data/site.json", "data/sync-status.json", "data/council.json", "data/changes.json", "photos/**"]

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  sync-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check for changes
        env:
          UMI_USER_AGENT: ${{ vars.UMI_USER_AGENT }}
          UMI_SITE_URL: ${{ vars.UMI_SITE_URL || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
        run: python3 sync.py ${{ inputs.force && '--force' || '' }}

      - name: Save new data and photos to the repository
        id: save
        env:
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data photos index.html
          if [ -e sitemap.xml ]; then git add sitemap.xml; fi
          if git diff --cached --quiet; then echo "Nothing new to save."; exit 0; fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          git commit -m "Sync ministers from Wikipedia and Wikidata"
          git pull --rebase -X theirs origin "$BRANCH"
          git push origin "HEAD:$BRANCH"

      - name: Open an issue if the update needs a look
        if: hashFiles('.sync-review.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Ministers update needs a look"
          if [ -z "$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number')" ]; then
            gh issue create --title "$title" --body-file .sync-review.md
          else
            echo "An issue is already open."
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deploy
        uses: actions/deploy-pages@v4
